      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            git \
            build-essential \
            binutils \
            tar \
            xz-utils \
            util-linux \
            bubblewrap

      - name: Install static XBPS
        run: |
          mkdir -p "$HOME/XBPS"

          curl -L \
            "https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz" \
            -o /tmp/xbps.tar.xz

          tar -xJf /tmp/xbps.tar.xz -C "$HOME/XBPS"

          echo "$HOME/XBPS/usr/bin" >> "$GITHUB_PATH"

      - name: Check XBPS
        run: |
          which xbps-install
          which xbps-query
          which xbps-uhelper
          which xbps-create
          which xbps-uchroot
          which xbps-uunshare

          xbps-install --version
          xbps-query --version

      - name: Configure chroot
        run: |
          echo 'XBPS_CHROOT_CMD=bwrap' >> etc/conf

      - name: Allow Bubblewrap user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Bootstrap XBPS
        run: |
          ./xbps-src binary-bootstrap
