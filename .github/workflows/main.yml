name: Build Void package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # ======================================================
        # CHANGE ONLY THIS VALUE TO BUILD ANOTHER PACKAGE
        # ======================================================
        package:
          - librewolf

    name: Build ${{ matrix.package }}
    runs-on: ubuntu-24.04

    env:
      PACKAGE: ${{ matrix.package }}
      XBPS_CHROOT_CMD: bwrap
      XBPS_CCACHE: yes
      XBPS_MIRROR: https://repo-default.voidlinux.org/current

    steps:
      # --------------------------------------------------------
      # Source checkout
      # --------------------------------------------------------
      - name: Checkout void-packages
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # --------------------------------------------------------
      # Restore persistent XBPS data
      #
      # repocache = downloaded XBPS dependencies
      # sources   = downloaded source archives
      # ccache    = compiler cache
      #
      # github.run_id makes every run save a new snapshot.
      # restore-keys lets the new run reuse the previous cache.
      # --------------------------------------------------------
      - name: Restore XBPS cache
        uses: actions/cache@v4
        with:
          path: |
            hostdir/repocache
            hostdir/sources
            hostdir/ccache

          key: >-
            xbps-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}

          restore-keys: |
            xbps-v2-${{ runner.os }}-${{ runner.arch }}-

          save-always: true

      # --------------------------------------------------------
      # Install host-side prerequisites
      # --------------------------------------------------------
      - name: Install host dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            bubblewrap \
            build-essential \
            binutils \
            curl \
            git \
            tar \
            util-linux \
            xz-utils

      # --------------------------------------------------------
      # Install static musl XBPS
      # --------------------------------------------------------
      - name: Install static XBPS
        env:
          XBPS_HOME: ${{ runner.temp }}/xbps-static
        run: |
          set -euo pipefail

          mkdir -p "$XBPS_HOME"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --silent \
            --show-error \
            --output "$RUNNER_TEMP/xbps-static.tar.xz" \
            "https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz"

          tar \
            --extract \
            --xz \
            --file "$RUNNER_TEMP/xbps-static.tar.xz" \
            --directory "$XBPS_HOME"

          echo "$XBPS_HOME/usr/bin" >> "$GITHUB_PATH"

      # --------------------------------------------------------
      # Verify static XBPS installation
      # --------------------------------------------------------
      - name: Verify XBPS
        run: |
          set -euo pipefail

          for tool in \
            xbps-install \
            xbps-query \
            xbps-uhelper \
            xbps-create \
            xbps-uchroot \
            xbps-uunshare
          do
            command -v "$tool"
          done

          xbps-install --version
          xbps-query --version

      # --------------------------------------------------------
      # Configure xbps-src
      # --------------------------------------------------------
      - name: Configure xbps-src
        run: |
          set -euo pipefail

          cat >> etc/conf <<EOF
          XBPS_CHROOT_CMD=${XBPS_CHROOT_CMD}
          XBPS_CCACHE=${XBPS_CCACHE}
          XBPS_MIRROR=${XBPS_MIRROR}
          EOF

      # --------------------------------------------------------
      # Ubuntu AppArmor can restrict unprivileged user namespaces,
      # which Bubblewrap needs.
      # --------------------------------------------------------
      - name: Allow Bubblewrap user namespaces
        run: |
          set -euo pipefail

          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # --------------------------------------------------------
      # Create the Void build environment.
      #
      # Dependencies downloaded here are stored in hostdir and
      # persisted by the GitHub Actions cache.
      # --------------------------------------------------------
      - name: Bootstrap XBPS
        run: |
          set -euo pipefail

          ./xbps-src binary-bootstrap

      # --------------------------------------------------------
      # Build selected package
      # --------------------------------------------------------
      - name: Build ${{ matrix.package }}
        run: |
          set -euo pipefail

          ./xbps-src pkg "$PACKAGE"

      # --------------------------------------------------------
      # Display everything that was produced
      # --------------------------------------------------------
      - name: Show generated packages
        run: |
          set -euo pipefail

          echo "Generated XBPS packages:"

          find hostdir/binpkgs \
            -type f \
            -name '*.xbps' \
            -print \
            | sort

      # --------------------------------------------------------
      # Show build dependencies for debugging
      # --------------------------------------------------------
      - name: Show build dependencies
        if: always()
        run: |
          ./xbps-src show-build-deps "$PACKAGE" || true

      # --------------------------------------------------------
      # Upload resulting binary packages
      # --------------------------------------------------------
      - name: Upload XBPS package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-xbps
          if-no-files-found: error
          compression-level: 0
          path: |
            hostdir/binpkgs/**/*.xbps
            hostdir/binpkgs/*.xbps
