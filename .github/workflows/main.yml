name: Build Void package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout void-packages
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            git \
            build-essential \
            binutils \
            tar \
            xz-utils \
            util-linux \
            bubblewrap

      - name: Install static XBPS
        run: |
          mkdir -p "$HOME/XBPS"

          curl -L \
            "https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz" \
            -o /tmp/xbps.tar.xz

          tar -xJf /tmp/xbps.tar.xz -C "$HOME/XBPS"

          echo "$HOME/XBPS/usr/bin" >> "$GITHUB_PATH"

      - name: Check XBPS
        run: |
          which xbps-install
          which xbps-query
          which xbps-uhelper
          which xbps-create
          which xbps-uchroot
          which xbps-uunshare

          xbps-install --version
          xbps-query --version

      - name: Bootstrap XBPS
        run: |
          ./xbps-src binary-bootstrap

      - name: Build libraw
        run: |
          ./xbps-src pkg libraw

      - name: Show generated packages
        run: |
          find hostdir/binpkgs -type f -name '*.xbps' -print

      - name: Upload XBPS package
        uses: actions/upload-artifact@v4
        with:
          name: libraw-xbps
          path: hostdir/binpkgs/**/*.xbps
